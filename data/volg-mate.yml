draft: false # set to false if all information is filled out
discontinued: false # set to true if the product is no loger available
brand: Volg # ex. "Club-mate"
product: Mate # ex. "Original"
size: 330 # size one unit (1 bottle/1 can) in milliliter, ex. 500
packaging: Can # type of packaging, {Can/Glas/PET/Tetrapak}
caffeine: 23 # caffeine in milligrams per 100ml, ex. 22
sugar: 5.8 # sugar in grams per 100ml, ex. 5
ingredients: # list of ingredients in original language
    - "Wasser"
    - "Zucker"
    - "Zitronensaft aus Konzentrat 3%"
    - "Yerba Mate-Extrakt 0.7%"
    - "Kohlensäure"
    - "Guaranasamenextrakt"
    - "Natürliches Mateblätter Aroma"
    - "Konservierungsstoff : Kalliumsorbat"
stores: # where to buy
    -
        name: Volg # name, ex. "Coop"
        url: https://www.volg.ch/ # direct product URL or URL to store (NO REFERRAL LINKS), ex. "https://somesite/products/mate.html"
        price: 1 # price of the whole package, ex. 11.50
        amount: 1 # package size, ex. 6
        date: 08.09.2026 # date in yyyy-MM-dd when you added the store data, ex 2023-01-01
        comment: # comment regarding the store, ex. "Only available in bigger stores, Only available during Winter"
